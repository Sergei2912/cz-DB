# =============================================================================
# Agent Orchestrator — LinkedIn Profile Optimizer
# Project: cz-career-architect (Dr. Sergii Anipreyev)
# =============================================================================

# --- Infrastructure ---
dataDir: ~/.agent-orchestrator
worktreeDir: ~/.worktrees
port: 3000
readyThresholdMs: 300000

# --- Default plugins ---
defaults:
  runtime: tmux
  agent: claude-code
  workspace: worktree
  notifiers:
    - desktop

# --- Projects ---
projects:
  Linkedin:
    name: LinkedIn Career Architect
    repo: Sergei2912/cz-career-architect
    path: /Users/sssssaaaaa/Desktop/Linkedin
    defaultBranch: main
    sessionPrefix: li
    symlinks:
      - .claude
      - .env
    agentConfig:
      permissions: skip
    agentRules: |
      LinkedIn profile optimizer for Dr. Sergii Anipreyev (DMD), Israeli market.
      Language: user=Russian, content=English, code/commits=English.
      Browser: full read-write with user confirmation on LinkedIn. All output is DRAFT only.
      Notion Medical Lexicon DB: acae23d9-42dd-4d0c-9a16-e9e88220805b
    agentRulesFile: .agent-rules.md
    reactions:
      approved-and-green:
        auto: false
        action: notify
        priority: action

# --- Notification routing ---
notificationRouting:
  urgent: [desktop]
  action: [desktop]
  warning: [desktop]
  info: [desktop]

# --- Reactions ---
reactions:
  ci-failed:
    auto: true
    action: send-to-agent
    retries: 2
    escalateAfter: 2
  changes-requested:
    auto: true
    action: send-to-agent
    escalateAfter: 30m
  merge-conflicts:
    auto: true
    action: send-to-agent
    retries: 1
  approved-and-green:
    auto: false
    action: notify
    priority: action
  agent-stuck:
    auto: true
    threshold: 10m
    action: notify
    priority: urgent
  agent-needs-input:
    auto: true
    action: notify
    priority: urgent
  agent-exited:
    auto: true
    action: notify
    priority: warning
    includeSummary: true
  all-complete:
    auto: true
    action: notify
    priority: info
    includeSummary: true

