    date_range: "April-May (day after Yom HaZikaron)"
    pillar: "IDF Transition"
    content_angle: "Building Israel's healthcare, national contribution through service"
    priority: "medium"
  - event: "Post-IDF Release Cycle"
    date_range: "July-August"
    pillar: "IDF Transition"
    content_angle: "Career transition advice for newly released soldiers"
    priority: "high"
  - event: "Academic Year Start"
    date_range: "October"
    pillar: "Clinical Cases"
    content_angle: "Dental education, mentoring new residents, clinical teaching"
    priority: "medium"
  - event: "International Dental Day"
    date_range: "March 6"
    pillar: "Clinical Cases"
