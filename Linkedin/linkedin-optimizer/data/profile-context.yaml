    priority: "medium"
  - event: "Medical Innovation Week Israel"
    date_range: "varies"
    pillar: "Tech in Dentistry"
    content_angle: "Israeli MedTech innovation, dental technology showcase"
    priority: "medium"
  - event: "Aliyah Anniversary"
    date_range: "personal"
    pillar: "European Perspective"
