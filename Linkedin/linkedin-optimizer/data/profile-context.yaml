  # Religious holidays — low/no engagement, avoid posting
  religious_holidays:
    - event: "Rosh Hashana"
      date_range: "September-October (1-2 Tishrei)"
      posting_rule: "avoid"
      notes: "2 days, most Israelis off work"
    - event: "Yom Kippur"
      date_range: "September-October (10 Tishrei)"
      posting_rule: "avoid"
      notes: "Complete fast day, zero engagement expected"
    - event: "Sukkot"
      date_range: "September-October (15-21 Tishrei)"
      posting_rule: "reduce"
      notes: "First and last days = holiday, middle days = chol hamoed (partial activity)"
    - event: "Pesach"
      date_range: "March-April (15-22 Nisan)"
      posting_rule: "reduce"
      notes: "First and last days = holiday, middle days = chol hamoed"
    - event: "Purim"
      date_range: "February-March (14 Adar)"
      posting_rule: "reduce"
      notes: "Light holiday, can post fun/informal content"

