# ─── POSTING SCHEDULE ───────────────────────────────────────────────────
posting_schedule:
  # Optimal times for Israeli audience (IST = UTC+2/+3)
  best_days: ["Sunday", "Thursday"]  # Israeli business week start + mid
  best_times:
    morning: "08:00-09:00 IST"    # commute time
    lunch: "12:00-13:00 IST"      # lunch break scrolling
    evening: "18:00-19:00 IST"    # post-work wind-down
  avoid: ["Friday", "Saturday"]    # Shabbat — very low engagement
