# ─── HASHTAG STRATEGY ───────────────────────────────────────────────────
hashtags:
  primary_en:  # use in every post
    - "#Endodontics"
    - "#DentalSurgeon"
    - "#IsraelHealthcare"
  secondary_en:  # rotate 2-3 per post
    - "#SurgicalMicroscope"
    - "#RootCanalTreatment"
    - "#DentalTechnology"
    - "#IDFVeterans"
    - "#MedTech"
    - "#DigitalDentistry"
  primary_he:  # use when HE content or bilingual
    - "#אנדודונטיה"
    - "#רפואתשיניים"
    - "#ישראל"
  secondary_he:
    - "#צהל"
    - "#מיקרוסקופכירורגי"
    - "#בריאותהפה"
  niche:  # use for specific pillars
    - "#CBCT"
    - "#NiTiFiles"
    - "#DentalMicroscopy"
    - "#ClinicalCases"
  rules:
    total_per_post: "3-5"
    mix: "2 EN primary + 1-2 EN secondary + 1 HE"
    pillar_specific: "Add 1 niche hashtag matching the pillar"

content_pillars:
  - id: clinical_cases
    label: "Clinical Case Studies"
    frequency: "bi-weekly"
    language: "English"
    examples:
      - "Complex MB2 calcified canal — microscope-assisted approach"
      - "Retreatment after failed RCT — step-by-step"

  - id: idf_transition
    label: "IDF-to-Civilian Transition"
    frequency: "monthly"
    language: "English/Hebrew"
    examples:
      - "Lessons from 8 years of military dental leadership"
      - "From IDF clinic commander to private practice"

  - id: european_perspective
    label: "European vs Israeli Practice"
    frequency: "monthly"
    language: "English"
    examples:
      - "How Czech dental practice differs from Israeli standards"
      - "What I learned navigating EU credential recognition"

  - id: tech_in_dentistry
    label: "Technology in Dentistry"
    frequency: "bi-weekly"
